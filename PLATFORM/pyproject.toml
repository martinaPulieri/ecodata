[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ecodata-platform"
version = "0.1.0"
description = "Modular monolith foundation for ecological data integration research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "httpx2>=2.16,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]
